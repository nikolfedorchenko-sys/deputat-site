<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бланк подяки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Бланк подяки депутата Київської міської ради. Формат A4, друк без полів. */
  :root{
    --navy:#0E2A5C;
    --blue:#1F4E9E;
    --gold:#B08D4C;
    --gold-light:#D9BF84;
    --ink:#1B2233;
    --muted:#5B6476;
    --paper:#FFFDF8;
  }
  @page{size:A4;margin:0}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#E9E6DF}
  body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .sheet{
    position:relative;width:210mm;height:297mm;margin:12mm auto;background:var(--paper);
    box-shadow:0 10px 40px rgba(14,42,92,.18);overflow:hidden;
  }
  @media print{
    html,body{background:none}
    .sheet{margin:0;box-shadow:none}
  }
  @media screen and (max-width:840px){
    .sheet{zoom:.45}
  }

  /* Рамка */
  .frame{position:absolute;inset:9mm;border:1.4pt solid var(--gold);pointer-events:none}
  .frame::after{content:"";position:absolute;inset:2.2mm;border:.5pt solid var(--gold)}
  .corner{position:absolute;width:11mm;height:11mm;pointer-events:none}
  .corner svg{width:100%;height:100%;display:block}
  .c-tl{top:6.5mm;left:6.5mm}
  .c-tr{top:6.5mm;right:6.5mm;transform:scaleX(-1)}
  .c-bl{bottom:6.5mm;left:6.5mm;transform:scaleY(-1)}
  .c-br{bottom:6.5mm;right:6.5mm;transform:scale(-1,-1)}

  /* Водяний знак */
  .watermark{position:absolute;left:50%;top:60%;width:120mm;transform:translate(-50%,-50%);opacity:.035;pointer-events:none}

  .content{position:absolute;inset:20mm 22mm 19mm;display:flex;flex-direction:column;align-items:center;text-align:center}

  .arms{width:25mm;height:auto;display:block}
  .council{margin-top:4.2mm;font-family:'Montserrat',sans-serif;font-weight:600;font-size:9.6pt;letter-spacing:.32em;color:var(--navy);text-transform:uppercase;padding-left:.32em}
  .convocation{margin-top:1.4mm;font-size:7.4pt;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;padding-left:.28em}

  .rule{display:flex;align-items:center;gap:3mm;width:100%;margin:6mm 0 5.2mm}
  .rule span{flex:1;height:.5pt;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
  .rule svg{width:7mm;height:7mm;flex:none}

  .position{font-size:8.4pt;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;padding-left:.2em}
  .name{margin-top:2.2mm;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17pt;letter-spacing:.06em;color:var(--navy)}

  .title{margin-top:15mm;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:60pt;line-height:1;letter-spacing:.2em;color:var(--navy);padding-left:.2em}
  .title-sub{margin-top:3.5mm;width:62mm;height:6mm}

  .lead{margin-top:11mm;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:15pt;color:var(--muted)}

  .field{width:100%;min-height:10.5mm;border-bottom:.6pt solid #B9B2A3;font-family:'Cormorant Garamond',serif;font-size:19pt;font-weight:600;color:var(--navy);line-height:10.5mm;outline:none}
  .recipient{margin-top:4mm}
  .recipient + .field{margin-top:0}
  .hint{margin-top:1.2mm;font-size:6.6pt;letter-spacing:.16em;color:#9A9384;text-transform:uppercase}

  .body{margin-top:9mm;width:100%;flex:1;font-family:'Cormorant Garamond',serif;font-size:15pt;line-height:10.5mm;color:var(--ink);outline:none;
    background-image:linear-gradient(to bottom,transparent calc(10.5mm - .6pt),#D3CCBD calc(10.5mm - .6pt),#D3CCBD 10.5mm);
    background-size:100% 10.5mm;max-height:73.5mm;overflow:hidden}

  .footer{width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:8mm;text-align:left}
  .sign-role{font-size:8.4pt;line-height:1.55;color:var(--ink)}
  .sign-role b{font-weight:600}
  .sign-line{display:flex;align-items:flex-end;gap:5mm}
  .sign-line .line{width:38mm;border-bottom:.6pt solid var(--ink);height:9mm}
  .sign-name{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:14pt;color:var(--navy);white-space:nowrap}
  .meta{width:100%;display:flex;justify-content:space-between;margin-top:7mm;font-size:8pt;color:var(--muted);letter-spacing:.04em}
  .meta .ls{letter-spacing:.24em;text-transform:uppercase;font-size:7pt}

  [contenteditable]:empty::before{content:attr(data-ph);color:#C2BBAB;font-style:italic;font-weight:500}
  @media print{[contenteditable]:empty::before{content:""}}
</style>
</head>
<body>

<!-- Спільні символи -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7CF92"/>
      <stop offset=".5" stop-color="#C6A15A"/>
      <stop offset="1" stop-color="#9C7838"/>
    </linearGradient>

    <!-- Архістратиг Михаїл (стилізація герба Києва) -->
    <g id="michael">
      <!-- крила -->
      <path d="M93 84 C80 70 66 52 58 26 C56 19 52 14 47 12 C52 30 50 48 56 64 C46 58 40 50 36 40 C38 58 44 70 54 79 C46 78 40 74 34 68 C38 82 50 90 64 94 C74 97 84 96 92 94 Z"/>
      <path d="M107 84 C120 70 134 52 142 26 C144 19 148 14 153 12 C148 30 150 48 144 64 C154 58 160 50 164 40 C162 58 156 70 146 79 C154 78 160 74 166 68 C162 82 150 90 136 94 C126 97 116 96 108 94 Z"/>
      <!-- шати -->
      <path d="M88 80 C93 77 107 77 112 80 L116 112 L113 114 L121 170 C112 174 88 174 79 170 L87 114 L84 112 Z"/>
      <!-- ноги -->
      <path d="M88 171 L92 171 L93 199 L99 203 L99 206 L84 206 L86 199 Z"/>
      <path d="M108 171 L112 171 L114 199 L116 206 L101 206 L101 203 L107 199 Z"/>
      <!-- голова і німб -->
      <path d="M96.5 72 L103.5 72 L104 80 L96 80 Z"/>
      <circle cx="100" cy="65" r="7.4"/>
      <path d="M100 49 A16 16 0 1 1 99.9 49 Z M100 51.2 A13.8 13.8 0 1 0 100.1 51.2 Z" fill-rule="evenodd"/>
      <!-- права рука з мечем -->
      <path d="M88 83 C82 86 76 80 72 70 L76 67 C79 74 83 78 89 79 Z"/>
      <path d="M72.6 66 L71.4 20 L74 14 L76.6 20 L75.4 66 Z"/>
      <rect x="66" y="64" width="16" height="3.2" rx="1.2"/>
      <rect x="72.4" y="67" width="3.2" height="7" rx="1"/>
      <!-- ліва рука і щит -->
      <path d="M112 84 C118 92 120 102 122 110 L118 112 C115 104 112 96 108 90 Z"/>
      <path d="M128 99 C140 99 146 110 146 124 C146 140 138 150 128 153 C118 150 110 140 110 124 C110 110 116 99 128 99 Z"/>
    </g>
    <!-- деталі: пір'я, пояс, складки -->
    <g id="michael-lines" fill="none" stroke-linecap="round">
      <path d="M88 88 C76 76 64 60 56 38"/><path d="M84 92 C70 86 58 76 48 60"/><path d="M78 95 C64 92 52 86 42 76"/>
      <path d="M112 88 C124 76 136 60 144 38"/><path d="M116 92 C130 86 142 76 152 60"/><path d="M122 95 C136 92 148 86 158 76"/>
      <path d="M86 113 C95 115.5 105 115.5 114 113" stroke-width="2.4"/>
      <path d="M95 118 L92 168"/><path d="M100 118 L100 170"/><path d="M105 118 L108 168"/>
      <path d="M128 106 V146 M118 122 H138"/>
    </g>
  </defs>
</svg>

<div class="sheet">
  <div class="frame"></div>

  <!-- кутові орнаменти -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="corner">
        <path d="M2 2 H40 M2 2 V40" stroke="#B08D4C" stroke-width="2.2" fill="none"/>
        <path d="M8 8 H26 M8 8 V26" stroke="#B08D4C" stroke-width="1" fill="none"/>
        <path d="M14 6 L17 9 L14 12 L11 9 Z" fill="#B08D4C" transform="translate(-3 3)"/>
      </g>
    </defs>
  </svg>
  <div class="corner c-tl"><svg viewBox="0 0 42 42"><use href="#corner"/></svg></div>
  <div class="corner c-tr"><svg viewBox="0 0 42 42"><use href="#corner"/></svg></div>
  <div class="corner c-bl"><svg viewBox="0 0 42 42"><use href="#corner"/></svg></div>
  <div class="corner c-br"><svg viewBox="0 0 42 42"><use href="#corner"/></svg></div>

  <!-- водяний знак: герб Києва -->
  <svg class="watermark" viewBox="0 0 200 240" aria-hidden="true">
    <path d="M12 12 H188 V150 C188 200 150 222 100 232 C50 222 12 200 12 150 Z" fill="none" stroke="#0E2A5C" stroke-width="2.5"/>
    <use href="#michael" fill="#0E2A5C"/>
  </svg>

  <div class="content">
    <!-- Герб Києва -->
    <svg class="arms" viewBox="0 0 200 240" role="img" aria-label="Герб міста Києва">
      <path d="M8 8 H192 V150 C192 203 152 226 100 236 C48 226 8 203 8 150 Z" fill="url(#gold)"/>
      <path d="M15 15 H185 V150 C185 198 148 218 100 228 C52 218 15 198 15 150 Z" fill="#1F4E9E"/>
      <path d="M19 19 H181 V150 C181 195 146 214 100 224 C54 214 19 195 19 150 Z" fill="none" stroke="#D9BF84" stroke-width=".8" opacity=".55"/>
      <g transform="translate(0 6)"><use href="#michael" fill="url(#gold)" stroke="#1F4E9E" stroke-width="1.6" paint-order="stroke"/><use href="#michael-lines" stroke="#1F4E9E" stroke-width="1.1"/></g>
    </svg>

    <div class="council">Київська міська рада</div>
    <div class="convocation">IX скликання</div>

    <div class="rule"><span></span>
      <!-- лист каштана -->
      <svg viewBox="-20 -20 40 40" aria-hidden="true"><g fill="#B08D4C">
        <ellipse cx="0" cy="-9" rx="3.2" ry="9"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="8" transform="rotate(-44)"/>
        <ellipse cx="0" cy="-9" rx="2.8" ry="8" transform="rotate(44)"/>
        <ellipse cx="0" cy="-8" rx="2.3" ry="6.6" transform="rotate(-88)"/>
        <ellipse cx="0" cy="-8" rx="2.3" ry="6.6" transform="rotate(88)"/>
        <rect x="-.6" y="0" width="1.2" height="10" rx=".6"/>
      </g></svg>
    <span></span></div>

    <div class="position">Депутат Київської міської ради</div>
    <div class="name">ТИХОНОВИЧ Юрій Станіславович</div>

    <div class="title">ПОДЯКА</div>
    <svg class="title-sub" viewBox="0 0 240 24" aria-hidden="true">
      <path d="M0 12 H96" stroke="#B08D4C" stroke-width="1"/>
      <path d="M144 12 H240" stroke="#B08D4C" stroke-width="1"/>
      <path d="M120 3 L129 12 L120 21 L111 12 Z" fill="none" stroke="#B08D4C" stroke-width="1.2"/>
      <path d="M120 8 L124 12 L120 16 L116 12 Z" fill="#B08D4C"/>
      <circle cx="102" cy="12" r="1.8" fill="#B08D4C"/><circle cx="138" cy="12" r="1.8" fill="#B08D4C"/>
    </svg>

    <div class="lead">висловлюю щиру вдячність</div>

    <div class="field recipient" contenteditable="true" spellcheck="false" data-ph="Прізвище, ім'я, по батькові / назва організації"></div>
    <div class="field" contenteditable="true" spellcheck="false"></div>
    <div class="hint">кому</div>

    <div class="body" contenteditable="true" spellcheck="false" data-ph="за ..."></div>

    <div class="footer">
      <div class="sign-role">Депутат<br><b>Київської міської ради</b></div>
      <div class="sign-line"><div class="line"></div><div class="sign-name">Юрій ТИХОНОВИЧ</div></div>
    </div>

    <div class="meta">
      <span>«____» ______________ 20____ р.</span>
      <span class="ls">м. Київ</span>
    </div>
  </div>
</div>

</body>
</html>
